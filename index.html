<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>./steve.sh</title>
    <link rel="stylesheet" href="ncurses.min.css">

    <style>
        .box {
            position: absolute;
            left: 50%;
            top: 50%;
            -webkit-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="box">
        <div class="box">
            <div class="content">
                <span class="title">Navigation</span>
                <p>Please choose an option:</p>
                <ul class="menu">
                    <li class="selectable">
                        <a id="home" href="/" class="btn">Go home</a>
                    </li>
                    <li class="selectable">
                        <a id="blog" href="https://blog.dotslashsteve.sh" class="btn">Visit blog</a>
                    </li>
                    <li class="selectable">
                        <a id="dnp" href="https://youareanidiot.cc/" class="btn">DO NOT PRESS</a>
                    </li>
                </ul>
                <div class="buttons">
                    <a id="ok" href="#" class="btn selectable">OK</a>
                    <a id="cancel" href="#" class="btn selectable">Cancel</a>
                </div> <!-- .buttons -->
            </div> <!-- .content -->
        </div>  <!-- .box -->
    </div> <!-- .container -->
</div>
</body>

<script>
    const cancel = document.getElementById('cancel');

    const selectableInputs = [].slice.call(document.getElementsByClassName('selectable'));

    let cursor = 0;

    function moveCursor(direction) {
        selectableInputs[cursor].classList.remove('active');
        if (direction !== null) {
            if (direction === 'down') {
                cursor += 1;
            } else if (direction === 'up') {
                cursor -= 1;
            } else if (direction === 'left' && cursor === 4) {
                cursor -= 1;
            } else if (direction === 'right' && cursor === 3) {
                cursor += 1;
            }

            if (cursor < 0) {
                cursor = 0;
            } else if (cursor > 4) {
                cursor = 4;
            }
        }
        selectableInputs[cursor].classList.add('active');
    }

    function updateCursor(idx) {
        selectableInputs[cursor].classList.remove('active');
        cursor = idx;

        if (cursor < 0) {
            cursor = 0;
        } else if (cursor > 4) {
            cursor = 4;
        }

        selectableInputs[cursor].classList.add('active');
    }

    cancel.addEventListener("click", () => {
        window.close();
    });

    function handleEnter() {
        if (cursor === 0) {
            window.location.reload();
        } else if (cursor === 1) {
            window.location.href = "https://blog.dotslashsteve.sh";
        } else if (cursor === 2) {
            window.location.href = "https://youareanidiot.cc/";
        }
    }

    document.body.addEventListener("keydown", (e) => {
        // e.preventDefault();
        if (e.code === "ArrowDown") {
            moveCursor("down");
        } else if (e.code === "ArrowUp") {
            moveCursor("up");
        } else if (e.code === "ArrowLeft") {
            moveCursor("left");
        } else if (e.code === "ArrowRight") {
            moveCursor("right");
        } else if (e.code === "Enter") {
            handleEnter();
        }
    });

    for (let element of selectableInputs) {
        element.addEventListener("mouseenter", (e) => {
                let target = null;
                // Find our hovered element in our selectables array
                if (e.target.id === "" && e.target.tagName.toLowerCase() === "li") {
                    target = e.target.getElementsByClassName("btn")[0];
                } else {
                    target = e.target;
                }

                // Now that we know what we're hovering over, find its index in the array

                for (let index = 0; index < selectableInputs.length; index++) {
                    let compareAgainst = selectableInputs[index];
                    if (selectableInputs[index].id === "") {
                        compareAgainst = selectableInputs[index].getElementsByClassName("btn")[0];
                    }

                    if (compareAgainst.id === target.id) {
                        // We have our index
                        updateCursor(index);
                    }
                }
            }
        )
    }

    moveCursor(null);

</script>

</html>
